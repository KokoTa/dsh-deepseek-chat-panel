# 市场收录条目草稿，只在准备上架时提交；修改本文件不会自动发布插件。
# 目标仓库：https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
# 把本文件提交为 data/plugins/KokoTa__dsh-deepseek-chat-panel.yml，等待审核合并。
# 合并后由市场生成展示信息，不要手工改市场仓库的 README。
# 提交前按市场当前规则核对：合法分类、仓库已声明 dsh.bundle、dsh-plugin topic 等。
# 更详细的字段解释见 docs/configuration.md。

# url 填源码仓库的公开地址，要和实际仓库一致。
url: https://github.com/KokoTa/dsh-deepseek-chat-panel
# name 使用 owner/repo；这是市场标识，和 npm 包名、本地目录名不是同一个字段。
name: KokoTa/dsh-deepseek-chat-panel
# category 用市场支持的分类值，browser 表示浏览器和网页类插件。
category: browser
# description 是市场列表里的中英文简介，应准确说明功能；带冒号等内容时用引号包住。
# 登录凭据经过本机 Host；上游是否继续接受凭据，仍由 DeepSeek 决定。
description:
  en: "In-UI panel that opens chat.deepseek.com inside the Harness Web UI through a Host-side loopback proxy, keeping the DeepSeek login across restarts and importing the login state of WeChat-only accounts."
  zh: "在 Harness 网页界面内用浮层面板打开 chat.deepseek.com，经 Host 端回环代理转发，跨重启保留 DeepSeek 登录态，并可从正式站点导入微信账号的登录态。"
# icon 是市场展示图标的公开图片链接；这里用 PNG，和插件包内的 icon.svg 分开使用。
icon: https://raw.githubusercontent.com/KokoTa/dsh-deepseek-chat-panel/main/assets/icon-180.png
